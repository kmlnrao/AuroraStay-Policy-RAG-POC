services:
  backend:
    build: ./backend
    ports:
      - "7860:7860"
    environment:
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_API_BASE: ${GROQ_API_BASE:-https://api.groq.com/openai/v1}
      GROQ_MODEL: ${GROQ_MODEL:-openai/gpt-oss-120b}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5-mini}
      OPENAI_EMBEDDING_MODEL: ${OPENAI_EMBEDDING_MODEL:-text-embedding-3-small}
      LLM_PROVIDER: ${LLM_PROVIDER:-openai}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-openai}
      API_ACCESS_KEY: ${API_ACCESS_KEY:?Add API_ACCESS_KEY to Codespaces or the local environment}
  frontend:
    build: ./frontend
    ports:
      - "8501:8501"
    environment:
      BACKEND_URL: http://backend:7860
      BACKEND_API_KEY: ${API_ACCESS_KEY:?Add API_ACCESS_KEY to Codespaces or the local environment}
    depends_on:
      - backend
